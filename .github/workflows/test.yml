name: Boogie CI

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  SOLUTION: Source/Boogie.sln
  Z3URL: https://github.com/Z3Prover/z3/releases/download/z3-4.11.2/z3-4.11.2-x64-glibc-2.31.zip
  CVC5URL: https://github.com/cvc5/cvc5/releases/download/cvc5-0.0.7/cvc5-Linux

jobs:
  job0:
    name: Boogie CI
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        configuration: [Debug, Release]
        lit_param: ["batch_mode=True", "batch_mode=False"]
    steps:
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Checkout Boogie
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Install tools, build Boogie, test Boogie
        run: |
          # Download a Z3 release
          wget ${Z3URL}
          unzip z3*.zip
          export PATH="$(find $PWD/z3* -name bin -type d):$PATH"
          # Download a CVC5 release
          mkdir -p bin
          (cd bin && wget ${CVC5URL} && mv cvc5-Linux cvc5 && chmod +x cvc5)
          export PATH="$PWD/bin:$PATH"
          # Install python tools
          sudo pip3 install setuptools
          sudo pip3 install lit OutputCheck pyyaml psutil
          # Change directory to Boogie root folder
          cd $GITHUB_WORKSPACE
          # Restore dotnet tools
          dotnet tool restore
          # Check that generated scanner and parser are consistent with attributed grammar
          dotnet tool run coco Source/Core/BoogiePL.atg -namespace Microsoft.Boogie -frames Source/Core/
          diff --strip-trailing-cr Source/Core/Parser.cs Source/Core/Parser.cs.old
          diff --strip-trailing-cr Source/Core/Scanner.cs Source/Core/Scanner.cs.old
          # Build Boogie
          dotnet build -warnaserror -c ${{ matrix.configuration }} ${SOLUTION}
          # Create packages
          dotnet pack --no-build -c ${{ matrix.configuration }} ${SOLUTION}
          # Run unit tests
          dotnet test --blame-hang-timeout 300s --no-build -c ${{ matrix.configuration }} ${SOLUTION}
          # Run lit test suite
          lit --param ${{ matrix.lit_param }} -v --timeout=300 -D configuration=${{ matrix.configuration }} Test
      # One leg carries the packages forward to the publish job. If the matrix
      # changes so that no leg matches, publishing fails on a missing artifact
      # instead of silently skipping the release.
      - name: Collect packages
        if: matrix.configuration == 'Release' && matrix.lit_param == 'batch_mode=False'
        run: |
          mkdir -p packages
          find Source -path '*/bin/Release/*' -name 'Boogie*.nupkg' -exec cp {} packages/ \;
          ls -1 packages
      - name: Upload packages
        if: matrix.configuration == 'Release' && matrix.lit_param == 'batch_mode=False'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: packages/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish release
    # Waits for every leg of the matrix above, so a failure in any
    # configuration blocks publishing.
    needs: job0
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      id-token: write   # NuGet Trusted Publishing (NuGet/login below)
      contents: write   # create the GitHub release
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: packages
      # The nuget.org Trusted Publishing policy must name THIS file: NuGet
      # matches the OIDC job_workflow_ref claim, which is the file defining
      # this job.
      - name: NuGet login (OIDC -> short-lived API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          # nuget.org profile name (not an email) of the policy owner.
          user: ${{ secrets.NUGET_USER }}
      - name: Deploy to nuget
        # --skip-duplicate so that re-running after a partial push of the 14
        # packages succeeds.
        run: >
          dotnet nuget push "packages/*.nupkg" --skip-duplicate
          -k ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          -s https://api.nuget.org/v3/index.json
      - name: Create GitHub release containing .nupkg files
        uses: softprops/action-gh-release@v1
        with:
          name: Boogie ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: packages/*.nupkg
          fail_on_unmatched_files: true
